<!DOCTYPE html>
<html>
<head>
  <title>Relativity Space Mission</title>

  <meta name="viewport"
    content="width=device-width, height=device-height,
    initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
      touch-action: none;
      color: white;
    }

    canvas {
      display: block;
      background: radial-gradient(circle at center, #001 0%, #000 80%);
    }

    #ui {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      border-radius: 10px;
      z-index: 20;
    }

    #gameOver {
      position: fixed;
      top: 40%;
      width: 100%;
      text-align: center;
      font-size: 28px;
      display: none;
      z-index: 30;
    }

    #barWrapper {
      position: fixed;
      bottom: 180px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      z-index: 15;
    }

    #barContainer {
      width: 100%;
      height: 20px;
      background: rgba(255,255,255,0.15);
      border: 2px solid white;
      border-radius: 10px;
      overflow: hidden;
    }

    #barFill {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, orange, cyan, blue);
    }

    #controls {
      position: fixed;
      bottom: 10px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 25px;
      z-index: 40;
    }

    .btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid white;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 16px;
    }

    #boostBtn {
      width: 85px;
      height: 85px;
      background: rgba(255,140,0,0.2);
    }
  </style>
</head>

<body>

<div id="ui">
  SPEED <span id="speed">0.20c</span><br>
  YOU AGE <span id="shipAge">20</span><br>
  TWIN AGE <span id="earthAge">20</span>
</div>

<div id="gameOver"></div>

<div id="barWrapper">
  <div id="barContainer">
    <div id="barFill"></div>
  </div>
</div>

<div id="controls">
  <div>
    <button class="btn" id="upBtn">UP</button><br><br>
    <button class="btn" id="downBtn">DOWN</button>
  </div>
  <button class="btn" id="boostBtn">BOOST</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let ship = {
  x: canvas.width * 0.2,
  y: canvas.height / 2,
  vy: 0
};

let speed = 0.2;
let up = false;
let down = false;
let boost = false;
let running = true;

let asteroids = [];
let fire = [];

const DIST = 12000;
let traveled = 0;

/* CONTROLS */
upBtn.ontouchstart = () => up = true;
upBtn.ontouchend = () => up = false;

downBtn.ontouchstart = () => down = true;
downBtn.ontouchend = () => down = false;

boostBtn.ontouchstart = () => boost = true;
boostBtn.ontouchend = () => boost = false;

/* ASTEROID */
function spawnAsteroid() {
  asteroids.push({
    x: canvas.width + 100,
    y: Math.random() * canvas.height,
    size: Math.random() * 25 + 15,
    speed: 2 + Math.random() * 2
  });
}

/* FIRE */
function spawnFire() {
  fire.push({
    x: ship.x - 15,
    y: ship.y + 5 + (Math.random() * 6 - 3),
    vx: -Math.random() * 5 - 3,
    life: 1,
    size: Math.random() * 5 + 3
  });
}

function update() {
  if (!running) return;

  if (up) ship.vy -= 0.4;
  if (down) ship.vy += 0.4;

  ship.vy *= 0.92;
  ship.y += ship.vy;

  if (boost) {
    speed += 0.003 * (1 - speed);
    spawnFire();
  } else {
    speed *= 0.995;
  }

  speed = Math.min(0.99, Math.max(0.2, speed));

  let gamma = 1 / Math.sqrt(1 - speed * speed);
  let worldSpeed = speed * gamma * 2.2;

  /* FIRE */
  fire.forEach(f => {
    f.x += f.vx;
    f.life -= 0.04;
  });
  fire = fire.filter(f => f.life > 0);

  /* ASTEROIDS */
  asteroids.forEach(a => {
    a.x -= (a.speed + worldSpeed);

    if (Math.abs(ship.x - a.x) < 30 &&
        Math.abs(ship.y - a.y) < 30) {
      gameOver();
    }
  });

  asteroids = asteroids.filter(a => a.x > -200);

  if (Math.random() < 0.05) spawnAsteroid();

  /* PROGRESS */
  traveled += worldSpeed;

  let progress = Math.min(traveled / DIST, 1);

  document.getElementById("barFill").style.width = (progress * 100) + "%";

  if (progress >= 1) winGame();

  document.getElementById("speed").innerText = speed.toFixed(2) + "c";
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  /* FIRE GLOW */
  ctx.fillStyle = "rgba(255,120,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(ship.x - 15, ship.y + 5, 20, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  /* FIRE */
  fire.forEach(f => {
    ctx.fillStyle = `rgba(255,140,0,${f.life})`;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
    ctx.fill();
  });

  /* SHIP */
  ctx.fillStyle = "white";
  ctx.fillRect(ship.x, ship.y, 20, 10);

  /* ASTEROIDS */
  asteroids.forEach(a => {
    let gamma = 1 / Math.sqrt(1 - speed * speed);

    ctx.fillStyle = "gray";
    ctx.beginPath();
    ctx.ellipse(
      a.x,
      a.y,
      a.size / gamma,
      a.size,
      0,
      0,
      Math.PI * 2
    );
    ctx.fill();
  });
}

function gameOver() {
  running = false;
  document.getElementById("gameOver").innerHTML =
    "CRASHED<br><button onclick='location.reload()'>RESTART</button>";
  document.getElementById("gameOver").style.display = "block";
}

function winGame() {
  running = false;
  document.getElementById("gameOver").innerHTML =
    "EARTH REACHED<br><button onclick='location.reload()'>PLAY AGAIN</button>";
  document.getElementById("gameOver").style.display = "block";
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
