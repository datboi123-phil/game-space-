<!DOCTYPE html>
<html>
<head>
  <title>Mobile Relativity Space Mission</title>

  <meta name="viewport"
    content="width=device-width, height=device-height,
    initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      color: white;
    }

    canvas {
      display: block;
      background: radial-gradient(circle at center, #001 0%, #000 80%);
    }

    #ui {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: clamp(12px, 3.5vw, 16px);
      line-height: 1.4;
      background: rgba(0,0,0,0.65);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      z-index: 20;
      min-width: 140px;
    }

    #instructions {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 82%;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.2);
      text-align: center;
      z-index: 50;
      transition: opacity 0.5s;
    }

    #instructions h2 {
      margin-top: 0;
      font-size: clamp(18px, 5vw, 26px);
    }

    #instructions p {
      font-size: clamp(12px, 3.8vw, 15px);
      margin: 8px 0;
    }

    #gameOver {
      position: fixed;
      top: 40%;
      width: 100%;
      text-align: center;
      font-size: clamp(24px, 6vw, 34px);
      display: none;
      z-index: 30;
    }

    /* SAFE PROGRESS BAR POSITION (NO OVERLAP) */
    #barWrapper {
      position: fixed;
      bottom: 190px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      z-index: 15;
    }

    #labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 12px;
    }

    #barContainer {
      position: relative;
      width: 100%;
      height: 22px;
      background: rgba(255,255,255,0.12);
      border: 2px solid white;
      border-radius: 12px;
      overflow: hidden;
    }

    #barFill {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, orange, cyan, blue);
    }

    .char {
      position: absolute;
      top: -28px;
      font-size: 18px;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    #playerChar { left: 0%; }
    #twinChar { left: 100%; }

    #controls {
      position: fixed;
      bottom: 12px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 30px;
      z-index: 40;
    }

    .btn {
      width: clamp(60px, 16vw, 80px);
      height: clamp(60px, 16vw, 80px);
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: clamp(14px, 4vw, 18px);
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .btn:active {
      background: rgba(0,255,255,0.25);
      transform: scale(0.95);
    }

    #boostBtn {
      width: clamp(75px, 18vw, 95px);
      height: clamp(75px, 18vw, 95px);
      background: rgba(255,140,0,0.18);
    }

    #flash {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.5s;
    }
  </style>
</head>

<body>

<div id="ui">
  SPEED <span id="speed">0.20c</span><br>
  YOU AGE <span id="shipAge">20.00</span><br>
  TWIN AGE <span id="earthAge">20.00</span><br>
  DIFFERENCE <span id="diff">0.00</span>
</div>

<div id="instructions">
  <h2>MOBILE CONTROLS</h2>
  <p>UP = Move Up</p>
  <p>DOWN = Move Down</p>
  <p>BOOST = Accelerate</p>
  <p style="color:cyan;margin-top:15px;">Tap to start mission</p>
</div>

<div id="gameOver"></div>
<div id="flash"></div>

<div id="barWrapper">
  <div id="labels">
    <div>START</div>
    <div>EARTH</div>
  </div>

  <div id="barContainer">
    <div id="barFill"></div>
    <div id="playerChar" class="char">YOU</div>
    <div id="twinChar" class="char">TWIN</div>
  </div>
</div>

<div id="controls">
  <div style="display:flex; flex-direction:column; gap:18px;">
    <div class="btn" id="upBtn">UP</div>
    <div class="btn" id="downBtn">DOWN</div>
  </div>

  <div class="btn" id="boostBtn">BOOST</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let ship = {
  x: canvas.width * 0.2,
  y: canvas.height / 2,
  velocityY: 0
};

let speed = 0.2;
let thrusting = false;
let movingUp = false;
let movingDown = false;
let gameRunning = true;
let gameStarted = false;

let asteroids = [];
let score = 0;

const MAX_DISTANCE = 10000;

let earth = {
  x: canvas.width + 12000,
  y: canvas.height / 2,
  size: 150
};

let earthAge = 20;
let shipAge = 20;

const thrustSound = new Audio("https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3");
const crashSound = new Audio("https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3");
const winSound = new Audio("https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3");

thrustSound.loop = true;
thrustSound.volume = 0.2;

function startMission() {
  if (!gameStarted) {
    gameStarted = true;
    document.getElementById("instructions").style.opacity = 0;
    setTimeout(() => {
      document.getElementById("instructions").style.display = "none";
    }, 500);
  }
}

document.getElementById("upBtn").ontouchstart = () => {
  startMission();
  movingUp = true;
};

document.getElementById("upBtn").ontouchend = () => movingUp = false;

document.getElementById("downBtn").ontouchstart = () => {
  startMission();
  movingDown = true;
};

document.getElementById("downBtn").ontouchend = () => movingDown = false;

document.getElementById("boostBtn").ontouchstart = () => {
  startMission();
  thrusting = true;
  if (thrustSound.paused) thrustSound.play();
};

document.getElementById("boostBtn").ontouchend = () => {
  thrusting = false;
  thrustSound.pause();
};

function spawnAsteroid() {
  asteroids.push({
    x: canvas.width + 100,
    y: Math.random() * canvas.height,
    size: Math.random() * 24 + 14,
    speed: 2 + Math.random() * 2
  });
}

function update() {
  if (!gameRunning) return;

  if (movingUp) ship.velocityY -= 0.4;
  if (movingDown) ship.velocityY += 0.4;

  ship.velocityY *= 0.92;
  ship.y += ship.velocityY;

  if (thrusting) speed += 0.003 * (1 - speed);
  else speed *= 0.995;

  speed = Math.min(0.99, Math.max(0.2, speed));

  let gamma = 1 / Math.sqrt(1 - speed * speed);
  let worldSpeed = speed * gamma * 2.2;
  let timeFactor = Math.sqrt(1 - speed * speed);

  asteroids.forEach(a => {
    a.x -= (a.speed + worldSpeed);
    if (Math.abs(ship.x - a.x) < 30 && Math.abs(ship.y - a.y) < 30) {
      gameOver();
    }
  });

  asteroids = asteroids.filter(a => a.x > -200);

  earth.x -= worldSpeed;

  if (Math.abs(ship.x - earth.x) < earth.size) winGame();

  score += 1 + speed * 3;

  let progress = Math.min(score / MAX_DISTANCE, 1);
  document.getElementById("barFill").style.width = (progress * 100) + "%";

  earthAge += 0.001;
  shipAge += 0.001 * timeFactor;

  document.getElementById("speed").innerText = speed.toFixed(2) + "c";
  document.getElementById("shipAge").innerText = shipAge.toFixed(2);
  document.getElementById("earthAge").innerText = earthAge.toFixed(2);
  document.getElementById("diff").innerText = (earthAge - shipAge).toFixed(2);

  if (Math.random() < 0.02) spawnAsteroid();
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "rgba(0,150,255,0.8)";
  ctx.beginPath();
  ctx.arc(earth.x, earth.y, earth.size, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.fillRect(ship.x, ship.y, 20, 10);

  asteroids.forEach(a => {
    ctx.fillStyle = "gray";
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.size, 0, Math.PI * 2);
    ctx.fill();
  });
}

function gameOver() {
  gameRunning = false;
  thrustSound.pause();
  crashSound.play();

  document.getElementById("gameOver").innerHTML =
    "CRASHED<br><button onclick='location.reload()'>RESTART</button>";

  document.getElementById("gameOver").style.display = "block";
}

function winGame() {
  gameRunning = false;
  thrustSound.pause();
  winSound.play();

  let flash = document.getElementById("flash");
  flash.style.opacity = 1;

  setTimeout(() => flash.style.opacity = 0, 400);

  document.getElementById("gameOver").innerHTML =
    "MISSION COMPLETE<br><button onclick='location.reload()'>PLAY AGAIN</button>";

  document.getElementById("gameOver").style.display = "block";
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
